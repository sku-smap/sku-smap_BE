name: CD - publish to ECR and deploy to EC2

on:
  push:
    branches: ["main"]

permissions:
  id-token: write
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'ap-northeast-2' }}
  ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY || 'smap-api' }}
  COMPOSE_FILE: docker-compose-prod.yaml

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify ECR repository exists
        run: aws ecr describe-repositories --repository-names "$ECR_REPOSITORY" > /dev/null

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      # Dockerfile builds the JAR with Java 17.
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest
            ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}

      - name: Prepare SSM deployment command
        env:
          ECR_REGISTRY: ${{ steps.ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          python3 <<'PY'
          import base64
          import json
          import os
          import shlex
          from pathlib import Path

          compose = base64.b64encode(Path(os.environ['COMPOSE_FILE']).read_bytes()).decode()
          commands = [
              'set -eu',
              'mkdir -p /home/ubuntu/smap/db/init',
              f"printf '%s' '{compose}' | base64 -d > /home/ubuntu/smap/docker-compose-prod.yaml",
          ]
          # postgres 초기화 SQL (compose가 ./db/init 을 마운트)
          for sql in sorted(Path('db/init').glob('*.sql')):
              encoded = base64.b64encode(sql.read_bytes()).decode()
              commands.append(f"printf '%s' '{encoded}' | base64 -d > /home/ubuntu/smap/db/init/{sql.name}")
          commands += [
              'cd /home/ubuntu/smap',
              'test -f .env.prod',
          ]
          for key in ('AWS_REGION', 'ECR_REGISTRY', 'ECR_REPOSITORY', 'IMAGE_TAG'):
              commands.append(f'export {key}={shlex.quote(os.environ[key])}')
          commands += [
              'aws ecr get-login-password --region "$AWS_REGION" | docker login --username AWS --password-stdin "$ECR_REGISTRY"',
              'docker compose --env-file .env.prod -f docker-compose-prod.yaml pull app',
              'docker compose --env-file .env.prod -f docker-compose-prod.yaml up -d --wait --wait-timeout 180',
              'docker compose --env-file .env.prod -f docker-compose-prod.yaml ps',
          ]
          Path('ssm-parameters.json').write_text(json.dumps({
              'commands': commands,
              'executionTimeout': ['600'],
          }))
          PY

      - name: Deploy on EC2 via SSM
        env:
          EC2_INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID }}
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$EC2_INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --timeout-seconds 600 \
            --parameters file://ssm-parameters.json \
            --query Command.CommandId --output text)

          STATUS=Pending
          for i in $(seq 1 65); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" --instance-id "$EC2_INSTANCE_ID" \
              --query Status --output text 2>/dev/null || echo Pending)
            echo "[$i/65] $STATUS"
            case "$STATUS" in
              Success|Failed|Cancelled|TimedOut) break ;;
            esac
            sleep 10
          done

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" --instance-id "$EC2_INSTANCE_ID" \
            --query '{Status:Status,Stdout:StandardOutputContent,Stderr:StandardErrorContent}'
          test "$STATUS" = Success

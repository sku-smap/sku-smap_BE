spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:default}

  application:
    name: smap

  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      password: ${REDIS_PASSWORD:}
      connect-timeout: 1s
      timeout: 1s

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  lifecycle:
    timeout-per-shutdown-phase: 30s

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

decorator:
  datasource:
    p6spy:
      enable-logging: true
      logging: slf4j
      multiline: true

springdoc:
  swagger-ui:
    path: /swagger-ui/index.html
  api-docs:
    path: /v3/api-docs

ai:
  openai:
    api-key: ${OPENAI_API_KEY:}
    base-url: https://api.openai.com
    model: gpt-4o-mini
    max-tokens: 2048

# 비공개 S3 사진은 DB 파일명을 그대로 키로 사용한다. 자격 증명은 AWS 기본 체인에서 읽는다.
storage:
  photos:
    enabled: ${S3_PHOTOS_ENABLED:true}
    bucket: ${S3_PHOTOS_BUCKET:smap-photos-450974103987-ap-northeast-2-an}
    region: ${AWS_REGION:ap-northeast-2}
    prefix: ${S3_PHOTOS_PREFIX:}
    access-key-id: ${AWS_ACCESS_KEY_ID:}
    secret-access-key: ${AWS_SECRET_ACCESS_KEY:}
    session-token: ${AWS_SESSION_TOKEN:}
    url-ttl-seconds: ${S3_PHOTOS_URL_TTL_SECONDS:3600}

# 전체 지도·노드·장소 목록의 DB 데이터 캐시. 사진 URL은 저장하지 않는다.
campus:
  cache:
    enabled: ${CAMPUS_CACHE_ENABLED:true}
    ttl-seconds: ${CAMPUS_CACHE_TTL_SECONDS:300}

management:
  endpoints:
    web:
      exposure:
        include: health, prometheus
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
  health:
    db:
      enabled: true
    redis:
      enabled: true
    diskspace:
      enabled: true

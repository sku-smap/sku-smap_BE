spring:
  flyway:
    enabled: false
  datasource:
    url: jdbc:h2:mem:smap;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  data:
    redis:
      host: localhost
      port: 6379
      password: ""
decorator:
  datasource:
    p6spy:
      enable-logging: false

# 일반 테스트 데이터가 Redis에 남지 않도록 캐시는 별도 통합 테스트에서만 활성화한다.
campus:
  cache:
    enabled: false


storage:
  photos:
    thumbnail-enabled: false
